name: DVC Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'dvc.yaml'
      - 'metrics.json'
  workflow_dispatch:

jobs:
  dvc-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install DVC
        run: pip install dvc
      
      - name: Show DVC config
        run: |
          echo "DVC is configured with Google Drive remote"
          echo "To pull data locally, run: dvc pull"
          cat dvc.yaml
      
      - name: Show metrics
        run: cat metrics.json
