name: DVC Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/models/**'
      - 'src/data/**'
      - 'dvc.yaml'
  workflow_dispatch:

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc[gdrive]
      
      - name: Setup DVC with Google Drive
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          mkdir -p ~/.config/dvc
          echo "$GDRIVE_CREDENTIALS_DATA" > ~/.config/dvc/gdrive-credentials.json
          dvc remote modify gdrive gdrive_use_service_account true
          dvc remote modify gdrive gdrive_service_account_json_file_path ~/.config/dvc/gdrive-credentials.json
      
      - name: Pull DVC data
        run: dvc pull
      
      - name: Show DVC status
        run: dvc status
      
      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.config/dvc/gdrive-credentials.json
