name: Weekly Model Retrain

on:
  schedule:
    # Every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining'
        required: false
        default: 'false'

jobs:
  check-retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check retraining status
        run: |
          echo "=========================================="
          echo "  MODEL RETRAINING CHECK"
          echo "=========================================="
          echo ""
          echo "Current model metrics:"
          cat metrics.json
          echo ""
          echo "----------------------------------------"
          echo "Training is performed on Kaggle with GPU"
          echo "Run: notebooks/github-issue-predictor.ipynb"
          echo "----------------------------------------"
          echo ""
          echo "After training on Kaggle:"
          echo "1. Download the model to best_model_bert_3class/"
          echo "2. Update metrics.json with new results"
          echo "3. Run: dvc add best_model_bert_3class && dvc push"
          echo "4. Run: python scripts/log_kaggle_run.py"
          echo "5. Commit and push changes"
      
      - name: Notify Slack (if configured)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK_URL \
            -H 'Content-type: application/json' \
            --data '{"text":"🔔 Weekly reminder: Check if model retraining is needed!"}'
