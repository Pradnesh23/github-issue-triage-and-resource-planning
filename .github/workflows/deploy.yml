name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/retrain.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Verify build
        run: |
          echo "✅ Dependencies installed successfully"
          python -c "from src.models.predict import GitHubIssuePredictor; print('Model import OK')" || echo "Model files not present (expected - use dvc pull locally)"
      
      # === DEPLOYMENT OPTIONS ===
      # Uncomment based on your cloud provider
      
      # Option 1: Deploy to Heroku
      # - name: Deploy to Heroku
      #   uses: akhileshns/heroku-deploy@v3.12.14
      #   with:
      #     heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
      #     heroku_app_name: "github-issues-triage"
      #     heroku_email: "your-email@example.com"
      
      # Option 2: Deploy to Railway
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@v1.0.0
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Build status
        run: |
          echo "✅ Build successful - ready for deployment"
          echo "Configure your deployment target in this workflow"
